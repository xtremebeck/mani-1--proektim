# Tests UzQuest (uz-quest/) on every pull request. On every push to main, once the tests pass,
# deploys the server to Railway and publishes GitHub Pages, which now only redirects visitors
# (and installed copies of the old static app) to the server.
name: Deploy UzQuest to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["uz-quest/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["uz-quest/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uz-quest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test game rules and server
        run: npm test
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install Chromium system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Browser tests (online, production settings, offline)
        run: npm run test:e2e

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Only deploys share this group, so a pull request run never cancels a deploy.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the redirect to the server
        run: npm run build
        working-directory: uz-quest
        env:
          REDIRECT_TO: https://uzquest-production.up.railway.app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: uz-quest/dist
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # Pages sometimes cannot find the artifact it was just given ("No artifacts named
      # github-pages"); a moment later it can. A re-run of the job does not help, because it
      # leaves two artifacts, so retry once within the same run.
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # Deploys the tested commit, not whatever main holds by then. Needs the RAILWAY_TOKEN secret
  # (see uz-quest/DEPLOY.md); without it the job only says so, so forks and new clones still pass.
  server:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deploys run one at a time, in order; a newer push waits instead of cancelling a half-done one.
    concurrency:
      group: railway
      cancel-in-progress: false
    environment:
      name: railway
      url: https://uzquest-production.up.railway.app
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ea08dcf7-89f8-4e9c-bc28-0d969aa0c98b
      RAILWAY_ENVIRONMENT_ID: 39715708-ac19-4305-a5ab-104ef52f33d7
      COMMIT: ${{ github.sha }}
      HEALTH_URL: https://uzquest-production.up.railway.app/api/v1/health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy the server to Railway
        working-directory: uz-quest
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::notice::RAILWAY_TOKEN is not set, so the server was not deployed. See uz-quest/DEPLOY.md."
            exit 0
          fi
          node scripts/deploy-railway.mjs
