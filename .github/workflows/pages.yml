# Publishes the UzQuest website + web app (uz-quest/) to GitHub Pages on every push to main.
name: Deploy UzQuest to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["uz-quest/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test game rules
        run: npm test
        working-directory: uz-quest
      - name: Build static site
        run: npm run build
        working-directory: uz-quest
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: uz-quest/dist
      - id: deployment
        uses: actions/deploy-pages@v4
