# Checks every 30 minutes that the live server answers. A failed run is the alert: GitHub emails
# about failed scheduled runs, and the Actions tab shows when the server was down.
name: Live server check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://uzquest-production.up.railway.app
    steps:
      - name: Health, app and website
        # Three tries a minute apart, so a restart during a deploy is not reported as an outage.
        run: |
          check() {
            curl -fsS --max-time 20 "$BASE/api/v1/health" | grep -q '"status":"ok"' &&
            curl -fsS --max-time 20 -o /dev/null "$BASE/app/" &&
            curl -fsS --max-time 20 -o /dev/null "$BASE/"
          }
          for attempt in 1 2 3; do
            if check; then echo "Up: $BASE"; exit 0; fi
            echo "Attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 60
          done
          echo "::error::$BASE is not answering. Check the service on Railway (deploy logs, crashes, usage limits)."
          exit 1
