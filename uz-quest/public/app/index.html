<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UzQuest" />
    <title>UzQuest — Play</title>
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../assets/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../assets/app-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="app.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>
    <div class="app">
      <p class="offline" id="offline" hidden></p>
      <main id="screen" class="screen"></main>
      <nav class="tabbar" id="tabbar" aria-label="Navigation">
        <a href="#/" data-tab="home"><span>🏠</span><b data-i18n="navHome"></b></a>
        <a href="#/explore" data-tab="explore"><span>🧭</span><b data-i18n="navExplore"></b></a>
        <a href="#/passport" data-tab="passport"><span>🛂</span><b data-i18n="navPassport"></b></a>
        <a href="#/rewards" data-tab="rewards"><span>🎁</span><b data-i18n="navRewards"></b></a>
        <a href="#/guide" data-tab="guide"><span>💬</span><b data-i18n="navGuide"></b></a>
      </nav>
    </div>
    <input type="file" id="photo-input" accept="image/*" capture="environment" hidden />
    <div class="toasts" id="toasts" popover="manual" aria-live="assertive"></div>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
