<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5d73"/>
      <stop offset=".45" stop-color="#e59a5c"/>
      <stop offset=".75" stop-color="#f6c77a"/>
      <stop offset="1" stop-color="#f8e2b0"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset=".55" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b86a4d"/>
      <stop offset="1" stop-color="#8c4e40"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d4a52"/>
      <stop offset="1" stop-color="#062a31"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fb7b3"/>
      <stop offset="1" stop-color="#0b6f73"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="820" cy="420" r="220" fill="url(#sun)"/>
  <circle cx="820" cy="420" r="70" fill="#fff1c8"/>

  <!-- birds -->
  <g fill="none" stroke="#3a2a2a" stroke-width="3" stroke-linecap="round" opacity=".55">
    <path d="M300 180q12-10 24 0q12-10 24 0"/>
    <path d="M360 150q9-8 18 0q9-8 18 0"/>
    <path d="M950 210q10-8 20 0q10-8 20 0"/>
  </g>

  <!-- far skyline -->
  <g fill="url(#far)" opacity=".9">
    <rect x="0" y="520" width="1200" height="280"/>
    <rect x="60" y="470" width="70" height="60"/>
    <rect x="150" y="440" width="46" height="90"/>
    <rect x="420" y="455" width="90" height="75"/>
    <rect x="980" y="450" width="60" height="80"/>
    <rect x="1060" y="480" width="90" height="50"/>
  </g>

  <!-- TV tower -->
  <g fill="#123c44">
    <path d="M934 540 L952 200 L962 200 L980 540 Z"/>
    <path d="M900 540 L950 360 L956 360 L918 540 Z"/>
    <path d="M1014 540 L962 360 L956 360 L996 540 Z"/>
    <ellipse cx="957" cy="300" rx="34" ry="16"/>
    <ellipse cx="957" cy="248" rx="22" ry="10"/>
    <rect x="954" y="90" width="6" height="115"/>
    <circle cx="957" cy="88" r="5" fill="#e76c50"/>
  </g>

  <!-- Arch with storks (Mustaqillik) -->
  <g fill="#f3ead7" stroke="#123c44" stroke-width="3">
    <rect x="600" y="430" width="16" height="130"/>
    <rect x="660" y="430" width="16" height="130"/>
    <rect x="720" y="430" width="16" height="130"/>
    <rect x="590" y="418" width="156" height="16"/>
  </g>
  <g fill="#123c44">
    <path d="M630 418c2-18 12-24 18-22l4-14 3 14c6 2 4 12-4 22z"/>
    <path d="M690 418c2-18 12-24 18-22l4-14 3 14c6 2 4 12-4 22z"/>
  </g>

  <!-- near skyline: Khast Imam style complex -->
  <g fill="url(#near)">
    <rect x="0" y="600" width="1200" height="200"/>
    <!-- minarets -->
    <rect x="96" y="360" width="30" height="260"/>
    <rect x="92" y="352" width="38" height="14"/>
    <path d="M96 352 q15-40 30 0z"/>
    <rect x="404" y="360" width="30" height="260"/>
    <rect x="400" y="352" width="38" height="14"/>
    <path d="M404 352 q15-40 30 0z"/>
    <!-- main portal -->
    <rect x="170" y="470" width="190" height="150"/>
    <rect x="145" y="500" width="240" height="120"/>
  </g>
  <path d="M232 620 V560 q33-50 66 0 V620 Z" fill="#e6b85a" opacity=".85"/>
  <g>
    <path d="M190 470 q75-150 150 0z" fill="url(#dome)"/>
    <rect x="258" y="360" width="14" height="20" fill="#e6b85a"/>
    <path d="M530 540 q55-110 110 0z" fill="url(#dome)"/>
    <rect x="520" y="540" width="130" height="80" fill="#0d4a52"/>
  </g>

  <!-- Amir Timur statue silhouette -->
  <g fill="#062a31">
    <rect x="810" y="560" width="70" height="60"/>
    <path d="M820 560c2-40 20-56 40-58c10-12 22-16 30-10c-6 6-8 12-6 20c8 14 6 34 0 48z"/>
    <path d="M858 506l-4-30c-2-12 8-18 14-10l4 20z"/>
  </g>

  <!-- trees -->
  <g fill="#0a3f45">
    <circle cx="1100" cy="590" r="44"/>
    <circle cx="1150" cy="600" r="36"/>
    <circle cx="740" cy="600" r="30"/>
    <circle cx="20" cy="600" r="40"/>
  </g>
  <rect x="0" y="620" width="1200" height="180" fill="#062a31"/>
  <!-- ornamental band -->
  <g fill="none" stroke="#e6b85a" stroke-width="2" opacity=".35">
    <path d="M0 640 H1200"/>
    <path d="M0 652 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12 l20 -12 l20 12"/>
  </g>
</svg>
